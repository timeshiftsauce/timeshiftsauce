# SyntaxSeed 主题贪吃蛇配置
# 文件路径: .github/workflows/snake-syntaxseed.yml

name: SyntaxSeed Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *" # 每6小时运行一次
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SyntaxSeed themed snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-syntaxseed.svg?palette=github-dark&color_snake=#2A9D8F&color_dots=#64FFDA,#0A192F,#2A9D8F,#64FFDA&color_empty=#0A192F
            dist/snake-ocean.svg?palette=github-dark&color_snake=#64FFDA&color_dots=#2A9D8F,#0A192F,#1e3a8a,#3b82f6&color_empty=#0f172a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
